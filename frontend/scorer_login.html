<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scorer Access · CSD & CSIT Cricket</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-white: #ffffff;
      --navy-950: #060e1a;
      --navy-900: #0a1728;
      --navy-800: #0f172a;
      --navy-700: #1e293b;
      --text-muted: #64748b;
      --cricket-blue: #0284c7;
      --cricket-blue-dark: #0369a1;
      --cricket-blue-light: #e0f2fe;
      --cricket-red: #e11d48;
      --cricket-red-light: #ffe4e6;
      --border-light: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-card: 0 4px 20px rgba(2, 132, 199, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--navy-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
    }

    .top-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--cricket-blue);
      text-decoration: none;
      margin-bottom: 12px;
    }

    .login-card {
      background: var(--bg-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 32px 24px;
      text-align: center;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--cricket-blue-light);
      color: var(--cricket-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .brand-tag {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--cricket-blue);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--navy-900);
      letter-spacing: 0.2px;
    }

    .error-alert {
      display: none;
      background: var(--cricket-red-light);
      color: var(--cricket-red);
      border: 1px solid rgba(225, 29, 72, 0.25);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--navy-700);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--navy-900);
      background: var(--bg-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--cricket-blue);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: var(--cricket-blue);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease, transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--cricket-blue-dark);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-footer {
      margin-top: 20px;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
    }
    .login-footer a {
      color: var(--cricket-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div style="text-align:left;">
    <a href="/" class="top-nav-link">
      <i class="fa fa-arrow-left"></i> Back to Public Match Center
    </a>
  </div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon-box">
        <i class="fa fa-clipboard-check"></i>
      </div>
      <div class="brand-tag">CSD & CSIT CRICKET</div>
      <h1 class="brand-title">SCORER ACCESS</h1>
    </div>

    <div class="error-alert" id="errorAlert" role="alert"></div>

    <form id="scorerLoginForm" onsubmit="handleScorerLogin(event)">
      <div class="form-group">
        <label class="form-label" for="scorerEmail">Scorer Email</label>
        <input 
          type="email" 
          id="scorerEmail" 
          class="form-input" 
          placeholder="scorer@college.edu" 
          autocomplete="username" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="scorerPassword">Password</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="scorerPassword" 
            class="form-input" 
            placeholder="••••••••••••" 
            autocomplete="current-password" 
            style="padding-right:38px;"
            required
          >
          <button 
            type="button" 
            id="btnTogglePassword" 
            onclick="togglePasswordVisibility()" 
            aria-label="Toggle password visibility"
            style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:4px;"
          >
            <i class="fa fa-eye" id="pwdEyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <i class="fa fa-arrow-right-to-bracket"></i> SIGN IN TO SCORE
      </button>
    </form>
  </div>

  <div class="login-footer">
    Tournament Administrator? <a href="/admin/login">Admin Sign-in</a>
    <div style="margin-top:6px; font-size:11px; color:#94a3b8;">
      &copy; 2026 CSD & CSIT Cricket · Official Scoring Portal
    </div>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('scorerPassword');
    const eyeIcon = document.getElementById('pwdEyeIcon');
    if (!pwdInput) return;
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      if (eyeIcon) eyeIcon.className = 'fa fa-eye-slash';
    } else {
      pwdInput.type = 'password';
      if (eyeIcon) eyeIcon.className = 'fa fa-eye';
    }
  }

  // Check if already authenticated
  fetch('/api/auth/me')
    .then(r => r.json())
    .then(data => {
      if (data.authenticated && data.user) {
        if (data.user.role === 'ADMIN') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/scorer/matches';
        }
      }
    })
    .catch(() => {});

  async function handleScorerLogin(e) {
    e.preventDefault();
    const email = document.getElementById('scorerEmail').value.trim();
    const password = document.getElementById('scorerPassword').value;
    const errEl = document.getElementById('errorAlert');
    const btn = document.getElementById('btnSubmit');

    errEl.style.display = 'none';
    errEl.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> SIGNING IN...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        const targetUrl = data.redirect || (data.user && data.user.role === 'ADMIN' ? '/admin' : '/scorer/matches');
        window.location.href = targetUrl;
      } else {
        errEl.textContent = data.error || 'Invalid email or password';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-arrow-right-to-bracket"></i> SIGN IN TO SCORE';
      }
    } catch (err) {
      errEl.textContent = 'Unable to connect to server. Please verify network connection.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-arrow-right-to-bracket"></i> SIGN IN TO SCORE';
    }
  }
</script>

</body>
</html>
